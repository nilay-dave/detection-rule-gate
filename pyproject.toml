[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-rule-gate"
version = "0.1.0"
description = "Fails a detection-as-code pull request when a Sigma rule is unmapped, unbounded or undocumented."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nilay Dave" }]
keywords = ["sigma", "detection-as-code", "detection-engineering", "linter", "mitre-attack", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# ruff is pinned exactly. Its formatter changes how it joins lines between
# releases, and CI gates on "ruff format --check", so an unpinned floor made
# that gate depend on the day the build ran rather than on the code: 28 files
# formatted under 0.6 were reported as unformatted under 0.17.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.17.1"]

[project.scripts]
drg = "drg.cli:main"

[project.urls]
Homepage = "https://github.com/nilay-dave/detection-rule-gate"
Documentation = "https://nilay-dave.github.io/detection-rule-gate/"
Issues = "https://github.com/nilay-dave/detection-rule-gate/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
