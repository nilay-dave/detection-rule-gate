name: badges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Measure coverage and count the checks
        id: measure
        run: |
          python -m pytest --cov=drg --cov-report=xml --quiet
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, sys, xml.etree.ElementTree as ET
          sys.path.insert(0, "src")
          from drg.checks import registry
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print(f"coverage={rate * 100:.1f}")
          print(f"checks={len(registry())}")
          PY

      - name: Write the endpoint files
        run: |
          mkdir -p public/badges
          python - <<'PY'
          import json, pathlib
          coverage = float("${{ steps.measure.outputs.coverage }}")
          checks = int("${{ steps.measure.outputs.checks }}")
          out = pathlib.Path("public/badges")
          # Colour from the value rather than a fixed one, so the badge means
          # something rather than being decoration that is always green.
          colour = "brightgreen" if coverage >= 95 else "yellow" if coverage >= 85 else "red"
          (out / "coverage.json").write_text(json.dumps({
              "schemaVersion": 1, "label": "coverage",
              "message": f"{coverage:.1f}%", "color": colour,
          }) + "\n")
          (out / "checks.json").write_text(json.dumps({
              "schemaVersion": 1, "label": "checks",
              "message": str(checks), "color": "blue",
          }) + "\n")
          PY

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth 1 || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rq --cached . 2>/dev/null || true
          find . -maxdepth 1 ! -name . ! -name .git ! -name public -exec rm -rf {} +
          mv public/* . && rmdir public
          touch .nojekyll
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh badge endpoints"
          git push origin gh-pages
