version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # The workflows pin actions by tag. Dependabot is what keeps those current,
  # which is the trade this repository accepts for readable workflow files. The
  # composite action itself pins nothing, because it uses no action at all.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
